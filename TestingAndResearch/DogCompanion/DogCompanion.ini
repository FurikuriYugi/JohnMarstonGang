; Setting this to 0 will prevent the dog's core from being displayed.
ShowCores=1

; Setting this to 1 will make your dog run towards hunted (and killed) animals, helping you finding them.
MarkHuntedAnimals=1

; Setting this to 1 will allow triggering the attack prompt.
AllowAttackPrompt=1
; Setting this to 1 will only show the attack prompt against animals.
AttackPromptAnimalsOnly=0
AttackPromptControlName=INPUT_INTERACT_OPTION2
IgnorePlayerCombatWhenSittingDown=1

AllowEnteringInteriors=1

InvincibleDog=0